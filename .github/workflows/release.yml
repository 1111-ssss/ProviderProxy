name: Release desktop app

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing app-vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish ZIP assets
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify release version
        shell: bash
        run: |
          version="${RELEASE_TAG#app-v}"
          cargo_version=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' rust-desktop/Cargo.toml | head -n 1)
          tauri_version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' rust-desktop/tauri.conf.json | head -n 1)
          test "$version" = "$cargo_version" || {
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }
          test "$version" = "$tauri_version" || {
            echo "Tag $RELEASE_TAG does not match tauri.conf.json version $tauri_version" >&2
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 mingw-w64-tools imagemagick zip \
            libwebkit2gtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build unsigned Linux and Windows ZIPs
        run: |
          mkdir -p "$RUNNER_TEMP/provider-proxy-release"
          PP_RELEASE_OUTPUT_DIR="$RUNNER_TEMP/provider-proxy-release" ./build-release.sh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Provider Proxy $RELEASE_TAG" \
              --notes "Unsigned portable ZIP builds for Linux and Windows."
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/provider-proxy-release/Provider-Proxy-v"*.zip \
            --clobber
