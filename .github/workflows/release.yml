name: Release desktop app

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing app-vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish ZIP assets
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set release version from tag
        shell: bash
        run: |
          version="${RELEASE_TAG#app-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          sed -i "0,/^version = \"[^\"]*\"$/s//version = \"$version\"/" rust-desktop/Cargo.toml
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$version\"/" rust-desktop/tauri.conf.json
          sed -i "/name = \"provider-proxy-desktop\"/{n;s/version = \"[^\"]*\"/version = \"$version\"/;}" rust-desktop/Cargo.lock

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 mingw-w64-tools imagemagick zip \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2 file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build unsigned Linux and Windows ZIPs
        run: |
          mkdir -p "$RUNNER_TEMP/provider-proxy-release"
          PP_RELEASE_OUTPUT_DIR="$RUNNER_TEMP/provider-proxy-release" ./build-release.sh

      - name: Package Node.js version
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          version="${VERSION#app-v}"
          package_dir="$RUNNER_TEMP/provider-proxy-node/provider-proxy-node-v$version"
          mkdir -p "$package_dir"
          cp README.md server.mjs config.example.json launch.sh launch-windows.ps1 "$package_dir/"
          cp -R public skills "$package_dir/"
          (cd "$RUNNER_TEMP/provider-proxy-node" && zip -qr \
            "$RUNNER_TEMP/provider-proxy-release/Provider-Proxy-Node-v$version.zip" \
            "provider-proxy-node-v$version")

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Provider Proxy $RELEASE_TAG" \
              --notes "Unsigned portable ZIP builds for Rust desktop (Linux and Windows) and Node.js."
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/provider-proxy-release/Provider-Proxy-v"*.zip \
            --clobber
