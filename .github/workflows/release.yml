name: Release desktop app

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing app-vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify release version
        shell: bash
        run: |
          version="${RELEASE_TAG#app-v}"
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust-desktop/Cargo.toml | head -n 1)
          tauri_version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' rust-desktop/tauri.conf.json | head -n 1)
          test "$version" = "$cargo_version" || {
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }
          test "$version" = "$tauri_version" || {
            echo "Tag $RELEASE_TAG does not match tauri.conf.json version $tauri_version" >&2
            exit 1
          }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: rust-desktop

      - name: Check updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          }

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: rust-desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Provider Proxy ${{ env.RELEASE_TAG }}
          releaseBody: "Windows installer (.exe), portable executable and Linux AppImage are attached below."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadPlainBinary: true
          args: --ci
