[package]
name = "provider-proxy-desktop"
version = "0.1.7"
edition = "2021"
description = "Cross-platform Rust desktop app for provider_proxy"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener"]

[lib]
name = "provider_proxy_desktop"
path = "src/lib.rs"

[[bin]]
name = "provider-proxy-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-opener = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
semver = "1"
url = "2"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
